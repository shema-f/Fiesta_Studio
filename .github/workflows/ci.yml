name: FIesta Studio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 22.x ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Type Check & Lint Codebase
        run: npm run lint

      - name: Verify Production Build
        run: npm run build

      - name: Verify Licensing & NOTICE Integrity
        run: |
          test -f LICENSE || (echo "LICENSE file missing!" && exit 1)
          test -f NOTICE || (echo "NOTICE file missing!" && exit 1)
          test -f TRADEMARKS.md || (echo "TRADEMARKS.md missing!" && exit 1)
